<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEM - Społeczność Discord</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: radial-gradient(circle at top center, #1b1024 0%, #09090d 75%);
            color: #e4e4eb;
            min-height: 100vh;
        }
        header {
            background-color: #0d0d12;
            padding: 15px 4%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #fa1e4e;
            box-shadow: 0 4px 20px rgba(250, 30, 78, 0.25);
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 45px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }
        .logo img {
            height: 45px;
            width: auto;
            display: block;
            filter: drop-shadow(0 0 6px rgba(250, 30, 78, 0.4));
        }
        .logo-text {
            color: #ffffff;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        nav {
            display: flex;
            align-items: center;
        }
        nav a {
            color: #9e9eb3;
            text-decoration: none;
            margin-right: 22px;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            padding: 8px 4px;
            transition: color 0.2s, text-shadow 0.2s;
        }
        nav a.active, nav a:hover {
            color: #fa1e4e;
            text-shadow: 0 0 10px rgba(250, 30, 78, 0.7);
        }
        main {
            max-width: 980px;
            margin: 35px auto;
            padding: 0 20px;
        }
        h2 {
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 14px;
            color: #ffffff;
            text-transform: uppercase;
            border-left: 3px solid #fa1e4e;
            padding-left: 10px;
        }
        .community-card {
            background-color: #12121a;
            border: 1px solid #262636;
            border-top: 3px solid #fa1e4e;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            text-align: center;
        }
        .community-banner {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid #262636;
        }
        .community-content {
            padding: 35px 25px;
        }
        .community-content h3 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .community-content p {
            color: #9e9eb3;
            font-size: 15px;
            max-width: 600px;
            margin: 0 auto 25px auto;
            line-height: 1.5;
        }
        a.discord-btn {
            display: inline-block;
            background-color: #fa1e4e;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 40px;
            font-size: 15px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
        }
        a.discord-btn:hover {
            background-color: #ff3360;
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(250, 30, 78, 0.9);
        }
        .web-fallback {
            display: block;
            margin-top: 14px;
            color: #6c6c85;
            font-size: 12px;
            text-decoration: none;
            transition: color 0.2s;
        }
        .web-fallback:hover {
            color: #fa1e4e;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-left">
            <a href="index.html" class="logo">
                <img src="STEM.png" onerror="this.onerror=null; this.src='stem.png';" alt="STEM Logo">
                <span class="logo-text">STEM</span>
            </a>
            <nav>
                <a href="index.html">SKLEP</a>
                <a href="spolecznosc.html" class="active">SPOŁECZNOŚĆ</a>
                <a href="informacje.html">INFORMACJE</a>
                <a href="pomoc.html">POMOC</a>
            </nav>
        </div>
    </header>

    <main>
        <h2>Społeczność STEM</h2>
        <div class="community-card">
            <img src="DISCORD.png" 
                 onerror="this.onerror=null; this.src='discord.png';" 
                 alt="STEM Discord Banner" 
                 class="community-banner">
            <div class="community-content">
                <h3>STEM - Official Discord Server</h3>
                <p>Dołącz do naszej społeczności graczy! Rozmawiaj o grach, szukaj ekipy do wspólnego grania i bądź na bieżąco z nowościami.</p>
                <a href="discord://-/invite/HKhbabC4Q7" class="discord-btn">Dołącz</a>
                <a href="https://discord.gg" target="_blank" rel="noopener noreferrer" class="web-fallback">Nie masz aplikacji? Otwórz w przeglądarce</a>
            </div>
        </div>
    </main>
</body>
</html>
