<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>STEM - GX Edition (Pełny Katalog)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: radial-gradient(circle at top center, #1b1024 0%, #09090d 75%);
            color: #e4e4eb;
            min-height: 100vh;
        }
        header {
            background-color: #0d0d12;
            padding: 15px 4%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #fa1e4e;
            box-shadow: 0 4px 20px rgba(250, 30, 78, 0.25);
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 45px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }
        .logo img {
            height: 45px;
            width: auto;
            display: block;
            filter: drop-shadow(0 0 6px rgba(250, 30, 78, 0.4));
        }
        .logo-text {
            color: #ffffff;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        nav {
            display: flex;
            align-items: center;
        }
        nav a {
            color: #9e9eb3;
            text-decoration: none;
            margin-right: 22px;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            padding: 8px 4px;
            transition: color 0.2s, text-shadow 0.2s;
        }
        nav a.active, nav a:hover {
            color: #fa1e4e;
            text-shadow: 0 0 10px rgba(250, 30, 78, 0.7);
        }
        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }
        .search-bar {
            background-color: #14141d;
            border: 1px solid #2b2b3d;
            border-left: 4px solid #fa1e4e;
            padding: 8px 12px;
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-bar:focus-within {
            border-color: #fa1e4e;
            box-shadow: 0 0 15px rgba(250, 30, 78, 0.3);
        }
        .search-bar input {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            padding: 6px 8px;
            font-size: 15px;
            outline: none;
        }
        .search-bar input::placeholder {
            color: #6c6c85;
        }
        .search-btn {
            background-color: #fa1e4e;
            color: #ffffff;
            border: none;
            padding: 0 22px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background-color 0.2s;
        }
        .search-btn:hover {
            background-color: #ff3360;
        }
        .category-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .cat-btn {
            background-color: #12121a;
            border: 1px solid #262636;
            color: #9e9eb3;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cat-btn.active, .cat-btn:hover {
            border-color: #fa1e4e;
            color: #ffffff;
            background-color: rgba(250, 30, 78, 0.15);
        }
        h2 {
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 18px;
            color: #ffffff;
            text-transform: uppercase;
            border-left: 3px solid #fa1e4e;
            padding-left: 10px;
        }
        .status-msg {
            color: #9e9eb3;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
        }
        .game-card {
            background-color: #12121a;
            border: 1px solid #262636;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .game-card:hover {
            transform: translateY(-4px);
            border-color: #fa1e4e;
            box-shadow: 0 6px 20px rgba(250, 30, 78, 0.35);
        }
        .game-card img {
            width: 100%;
            height: 145px;
            object-fit: cover;
            background-color: #09090d;
            display: block;
            border-bottom: 1px solid #262636;
        }
        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }
        .card-body h4 {
            color: #ffffff;
            margin-bottom: 12px;
            font-size: 16px;
            line-height: 1.3;
        }
        .steam-warning {
            background-color: rgba(250, 30, 78, 0.1);
            border-left: 2px solid #fa1e4e;
            color: #ffb3c4;
            font-size: 11px;
            line-height: 1.35;
            padding: 6px 8px;
            margin-bottom: 10px;
        }
        .price-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }
        .price-tag {
            color: #fa1e4e;
            font-weight: bold;
            font-size: 15px;
        }
        a.steam-btn {
            display: inline-block;
            text-align: center;
            background-color: #fa1e4e;
            color: #ffffff;
            text-decoration: none;
            padding: 9px 16px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.8px;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        a.steam-btn:hover {
            background-color: #ff3360;
            box-shadow: 0 0 12px rgba(250, 30, 78, 0.8);
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-left">
            <a href="index.html" class="logo">
                <img src="STEM.png" onerror="this.onerror=null; this.src='stem.png';" alt="STEM Logo">
                <span class="logo-text">STEM</span>
            </a>
            <nav>
                <a href="index.html" class="active">SKLEP</a>
                <a href="spolecznosc.html">SPOŁECZNOŚĆ</a>
                <a href="informacje.html">INFORMACJE</a>
                <a href="pomoc.html">POMOC</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="search-bar">
            <input type="text" id="searchInput" onkeypress="if(event.key === 'Enter') searchSteam()" placeholder="Wpisz nazwę dowolnej gry ze Steam (np. Minecraft, Rust, Terraria, Elden Ring)...">
            <button class="search-btn" onclick="searchSteam()">Szukaj</button>
        </div>

        <div class="category-tabs">
            <button class="cat-btn active" onclick="loadCategory('top_sellers', this)">Bestsellery Steam</button>
            <button class="cat-btn" onclick="loadCategory('specials', this)">Promocje</button>
            <button class="cat-btn" onclick="loadCategory('new_releases', this)">Nowości</button>
            <button class="cat-btn" onclick="loadCategory('coming_soon', this)">Nadchodzące</button>
        </div>

        <h2 id="sectionTitle">Bestsellery Steam</h2>
        <div id="statusMsg" class="status-msg">Ładowanie katalogu gier ze Steam...</div>
        <div class="games-grid" id="gamesGrid"></div>
    </main>

    <script>
        const grid = document.getElementById('gamesGrid');
        const statusMsg = document.getElementById('statusMsg');
        const sectionTitle = document.getElementById('sectionTitle');

        // Pobieranie kategorii ze sklepu Steam przez publiczne proxy CORS
        async function loadCategory(category, btnElement) {
            if (btnElement) {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
                sectionTitle.innerText = btnElement.innerText;
            }

            grid.innerHTML = '';
            statusMsg.innerText = 'Pobieranie aktualnych gier ze Steam...';

            try {
                const steamUrl = encodeURIComponent('https://steampowered.com');
                const response = await fetch(`https://allorigins.win{steamUrl}`);
                const data = await response.json();
                const parsed = JSON.parse(data.contents);

                const items = parsed[category]?.items || [];
                if (items.length === 0) {
                    statusMsg.innerText = 'Nie znaleziono gier w tej kategorii.';
                    return;
                }

                statusMsg.innerText = `Wyświetlono ${items.length} gier ze sklepu Steam:`;
                renderGames(items);
            } catch (error) {
                statusMsg.innerText = 'Wystąpił problem z połączeniem z bazą Steam. Spróbuj odświeżyć stronę lub użyj wyszukiwarki.';
            }
        }
