<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>STEM - GX Edition</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Arial,sans-serif}
body{background:radial-gradient(circle at top center,#1b1024 0%,#09090d 75%);color:#e4e4eb;min-height:100vh}
header{background:#0d0d12;padding:15px 4%;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #fa1e4e;box-shadow:0 4px 20px rgba(250,30,78,.25)}
.nav-left{display:flex;align-items:center;gap:45px}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none}
.logo img{height:45px;width:auto;display:block}
.logo-text{color:#fff;font-size:26px;font-weight:900;letter-spacing:3px}
nav a{color:#9e9eb3;text-decoration:none;margin-right:22px;font-weight:800;font-size:14px;letter-spacing:1px}
nav a.active,nav a:hover{color:#fa1e4e}
a.install-btn{background:#fa1e4e;color:#fff;text-decoration:none;padding:9px 18px;font-size:13px;font-weight:800;text-transform:uppercase}
main{max-width:1100px;margin:35px auto;padding:0 20px}
.search-bar{background:#14141d;border:1px solid #2b2b3d;border-left:4px solid #fa1e4e;padding:10px 14px;margin-bottom:30px;display:flex;gap:10px}
.search-bar input{width:100%;background:transparent;border:none;color:#fff;font-size:15px;outline:none}
.clear-btn{background:transparent;color:#9e9eb3;border:1px solid #2b2b3d;padding:6px 14px;font-weight:bold;font-size:11px;cursor:pointer}
h2{font-size:14px;letter-spacing:2px;margin-bottom:18px;color:#fff;text-transform:uppercase;border-left:3px solid #fa1e4e;padding-left:10px}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.game-card{background:#12121a;border:1px solid #262636;display:flex;flex-direction:column;justify-content:space-between;transition:.2s}
.game-card:hover{transform:translateY(-4px);border-color:#fa1e4e;box-shadow:0 6px 20px rgba(250,30,78,.35)}
.game-card img{width:100%;height:150px;object-fit:cover;border-bottom:1px solid #262636}
.card-body{padding:16px;display:flex;flex-direction:column;justify-content:space-between;flex-grow:1}
.card-body h4{color:#fff;margin-bottom:6px;font-size:17px}
.genre-tag{color:#6c6c85;font-size:12px;margin-bottom:14px;text-transform:uppercase}
.steam-warning{background:rgba(250,30,78,.1);border-left:2px solid #fa1e4e;color:#ffb3c4;font-size:11px;padding:6px 8px;margin-bottom:12px}
.price-action{display:flex;justify-content:space-between;align-items:center}
.price-tag{color:#fa1e4e;font-weight:bold;font-size:15px}
a.steam-btn{background:#fa1e4e;color:#fff;text-decoration:none;padding:9px 16px;font-weight:bold;text-transform:uppercase;font-size:12px}
.no-results{display:none;background:#12121a;border:1px solid #fa1e4e;padding:25px;text-align:center;margin-top:20px}
</style>
</head>
<body>
<header>
<div class="nav-left">
<a href="index.html" class="logo"><img src="STEM.png" alt="STEM"><span class="logo-text">STEM</span></a>
<nav>
<a href="index.html" class="active">SKLEP</a>

</nav>
</div>
<a href="https://steampowered.com" target="_blank" class="install-btn">⬇ Pobierz Steam</a>
</header>
<main>
<div class="search-bar">
<input type="text" id="searchBox" oninput="szukajGry()" placeholder="Szukaj wśród 40 gier (np. GTA, CS2, Helldivers, DayZ, Sims)...">
<button class="clear-btn" onclick="wyczysc()">Wyczyść</button>
</div>
<h2>Katalog gier STEM (40 tytułów)</h2>
<div class="games-grid" id="listaGier"></div>
<div id="brakWynikow" class="no-results">
<p style="margin-bottom:15px;">Nie znaleziono tej gry na liście powyżej.</p>
<a id="linkSteamSzukaj" href="https://steampowered.com" target="_blank" class="steam-btn">Szukaj bezpośrednio na Steam</a>
</div>
</main>

function pokazGry(l){
var h='';
for(var k=0;k<l.length;k++){
var x=l.at(k);
var img=x.i?'<img src="'+x.i+'" alt="'+x.n+'">':'';
h+='<div class="game-card">'+img+'<div class="card-body"><div><h4>'+x.n+'</h4><div class="genre-tag">'+x.g+'</div></div><div><div class="steam-warning">⚠ Kliknięcie otworzy aplikację Steam. Jeśli jej nie posiadasz, link nie zadziała.</div><div class="price-action"><span class="price-tag">'+x.c+'</span><a href="steam://store/'+x.id+'" class="steam-btn">Kup na Steam</a></div></div></div></div>';
}
document.getElementById('listaGier').innerHTML=h;
}
function szukajGry(){
var t=document.getElementById('searchBox').value.toLowerCase().trim();
var w=gry.filter(function(x){return x.n.toLowerCase().indexOf(t)>-1||x.g.toLowerCase().indexOf(t)>-1});
pokazGry(w);
var b=document.getElementById('brakWynikow');
if(w.length===0&&t.length>0){b.style.display='block';document.getElementById('linkSteamSzukaj').href='https://steampowered.com?term='+encodeURIComponent(t)}else{b.style.display='none'}
}
function wyczysc(){document.getElementById('searchBox').value='';szukajGry()}
pokazGry(gry);
