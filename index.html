<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>STEM - GX Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: radial-gradient(circle at top center, #1b1024 0%, #09090d 75%);
            color: #e4e4eb;
            min-height: 100vh;
        }
        header {
            background-color: #0d0d12;
            padding: 15px 4%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #fa1e4e;
            box-shadow: 0 4px 20px rgba(250, 30, 78, 0.25);
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 45px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }
        .logo img {
            height: 45px;
            width: auto;
            display: block;
            filter: drop-shadow(0 0 6px rgba(250, 30, 78, 0.4));
        }
        .logo-text {
            color: #ffffff;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        nav {
            display: flex;
            align-items: center;
        }
        nav a {
            color: #9e9eb3;
            text-decoration: none;
            margin-right: 22px;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            padding: 8px 4px;
            transition: color 0.2s, text-shadow 0.2s;
        }
        nav a.active, nav a:hover {
            color: #fa1e4e;
            text-shadow: 0 0 10px rgba(250, 30, 78, 0.7);
        }
        a.install-steam-btn {
            background-color: #fa1e4e;
            color: #ffffff;
            text-decoration: none;
            padding: 9px 18px;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid #fa1e4e;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s, box-shadow 0.2s, transform 0.2s;
        }
        a.install-steam-btn:hover {
            background-color: #ff3360;
            box-shadow: 0 0 15px rgba(250, 30, 78, 0.85);
            transform: translateY(-1px);
        }
        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }
        .search-bar {
            background-color: #14141d;
            border: 1px solid #2b2b3d;
            border-left: 4px solid #fa1e4e;
            padding: 8px 12px;
            margin-bottom: 35px;
            display: flex;
            gap: 10px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-bar:focus-within {
            border-color: #fa1e4e;
            box-shadow: 0 0 15px rgba(250, 30, 78, 0.3);
        }
        .search-bar input {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            padding: 6px 8px;
            font-size: 15px;
            outline: none;
        }
        .search-bar input::placeholder {
            color: #6c6c85;
        }
        .clear-btn {
            background-color: transparent;
            color: #9e9eb3;
            border: 1px solid #2b2b3d;
            padding: 0 16px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .clear-btn:hover {
            color: #ffffff;
            border-color: #fa1e4e;
        }
        h2 {
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 16px;
            color: #ffffff;
            text-transform: uppercase;
            border-left: 3px solid #fa1e4e;
            padding-left: 10px;
        }
        .section-block {
            margin-bottom: 50px;
        }
        .featured-box {
            display: flex;
            background-color: #12121a;
            border: 1px solid #262636;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .featured-box:hover {
            border-color: #fa1e4e;
        }
        .featured-box img {
            width: 62%;
            min-height: 280px;
            object-fit: cover;
            background-color: #09090d;
            border-right: 1px solid #262636;
        }
        .featured-info {
            padding: 25px;
            width: 38%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .featured-info h3 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .featured-info p.desc {
            color: #9e9eb3;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        .tags-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 15px;
        }
        .mini-tag {
            background-color: rgba(250, 30, 78, 0.15);
            color: #ff7a98;
            font-size: 11px;
            padding: 3px 8px;
            border: 1px solid rgba(250, 30, 78, 0.3);
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
        }
        .game-card {
            background-color: #12121a;
            border: 1px solid #262636;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .game-card:hover {
            transform: translateY(-4px);
            border-color: #fa1e4e;
            box-shadow: 0 6px 20px rgba(250, 30, 78, 0.35);
        }
        .game-card img {
            width: 100%;
            height: 145px;
            object-fit: cover;
            background-color: #09090d;
            display: block;
            border-bottom: 1px solid #262636;
        }
        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }
        .card-body h4 {
            color: #ffffff;
            margin-bottom: 6px;
            font-size: 16px;
            line-height: 1.3;
        }
        .genre-tag {
            color: #6c6c85;
            font-size: 12px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .steam-warning {
            background-color: rgba(250, 30, 78, 0.1);
            border-left: 2px solid #fa1e4e;
            color: #ffb3c4;
            font-size: 11px;
            line-height: 1.35;
            padding: 6px 8px;
            margin-bottom: 10px;
        }
        .price-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }
        .discount-group {
            display: flex;
            align-items: center;
            background-color: #09090d;
            border: 1px solid #262636;
        }
        .discount-badge {
            background-color: #fa1e4e;
            color: #ffffff;
            font-weight: 900;
            font-size: 14px;
            padding: 6px 8px;
        }
        .prices-stack {
            padding: 3px 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .old-price {
            color: #6c6c85;
            text-decoration: line-through;
            font-size: 10px;
        }
        .price-tag {
            color: #fa1e4e;
            font-weight: bold;
            font-size: 14px;
        }
        a.steam-btn {
            display: inline-block;
            text-align: center;
            background-color: #fa1e4e;
            color: #ffffff;
            text-decoration: none;
            padding: 9px 14px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.8px;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        a.steam-btn:hover {
            background-color: #ff3360;
            box-shadow: 0 0 12px rgba(250, 30, 78, 0.8);
        }
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }
        .category-tile {
            background: linear-gradient(135deg, #1a1025 0%, #12121a 100%);
            border: 1px solid #262636;
            border-bottom: 3px solid #fa1e4e;
            padding: 25px 20px;
            text-align: center;
            color: #ffffff;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .category-tile:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #fa1e4e 0%, #7a0b24 100%);
            box-shadow: 0 6px 20px rgba(250, 30, 78, 0.4);
        }
        .direct-search-box {
            background-color: #12121a;
