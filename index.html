<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEM - GX Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Arial, sans-serif; }
        body { background: radial-gradient(circle at top center, #1b1024 0%, #09090d 75%); color: #e4e4eb; min-height: 100vh; }
        header { background-color: #0d0d12; padding: 15px 4%; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #fa1e4e; box-shadow: 0 4px 20px rgba(250, 30, 78, 0.25); }
        .nav-left { display: flex; align-items: center; gap: 45px; }
        .logo { display: flex; align-items: center; gap: 14px; text-decoration: none; }
        .logo img { height: 45px; width: auto; display: block; }
        .logo-text { color: #fff; font-size: 26px; font-weight: 900; letter-spacing: 3px; }
        nav a { color: #9e9eb3; text-decoration: none; margin-right: 22px; font-weight: 800; font-size: 14px; letter-spacing: 1px; }
        nav a.active, nav a:hover { color: #fa1e4e; }
        a.install-btn { background: #fa1e4e; color: #fff; text-decoration: none; padding: 9px 18px; font-size: 13px; font-weight: 800; text-transform: uppercase; }
        main { max-width: 1100px; margin: 35px auto; padding: 0 20px; }
        .search-bar { background: #14141d; border: 1px solid #2b2b3d; border-left: 4px solid #fa1e4e; padding: 10px 14px; margin-bottom: 30px; display: flex; gap: 10px; }
        .search-bar input { width: 100%; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; }
        .clear-btn { background: transparent; color: #9e9eb3; border: 1px solid #2b2b3d; padding: 6px 14px; font-weight: bold; font-size: 11px; cursor: pointer; }
        h2 { font-size: 14px; letter-spacing: 2px; margin-bottom: 18px; color: #fff; text-transform: uppercase; border-left: 3px solid #fa1e4e; padding-left: 10px; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; }
        .game-card { background: #12121a; border: 1px solid #262636; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
        .game-card:hover { transform: translateY(-4px); border-color: #fa1e4e; box-shadow: 0 6px 20px rgba(250, 30, 78, 0.35); }
        .game-card img { width: 100%; height: 150px; object-fit: cover; border-bottom: 1px solid #262636; }
        .card-body { padding: 16px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .card-body h4 { color: #fff; margin-bottom: 6px; font-size: 17px; }
        .genre-tag { color: #6c6c85; font-size: 12px; margin-bottom: 14px; text-transform: uppercase; }
        .steam-warning { background: rgba(250, 30, 78, 0.1); border-left: 2px solid #fa1e4e; color: #ffb3c4; font-size: 11px; padding: 6px 8px; margin-bottom: 12px; }
        .price-action { display: flex; justify-content: space-between; align-items: center; }
        .price-tag { color: #fa1e4e; font-weight: bold; font-size: 15px; }
        a.steam-btn { background: #fa1e4e; color: #fff; text-decoration: none; padding: 9px 16px; font-weight: bold; text-transform: uppercase; font-size: 12px; }
        .no-results { display: none; background: #12121a; border: 1px solid #fa1e4e; padding: 25px; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <div class="nav-left">
            <a href="index.html" class="logo"><img src="STEM.png" alt="STEM"><span class="logo-text">STEM</span></a>
            <nav>
                <a href="index.html" class="active">SKLEP</a>
                <a href="spolecznosc.html">SPOŁECZNOŚĆ</a>
                <a href="informacje.html">INFORMACJE</a>
                <a href="pomoc.html">POMOC</a>
            </nav>
        </div>
        <a href="https://steampowered.com" target="_blank" class="install-btn">⬇ Pobierz Steam</a>
    </header>

    <main>
        <div class="search-bar">
            <input type="text" id="searchBox" oninput="szukajGry()" placeholder="Wpisz nazwę gry (np. GTA, CS2, Forza, Elden Ring)...">
            <button class="clear-btn" onclick="wyczysc()">Wyczyść</button>
        </div>

        <h2>Katalog gier STEM</h2>
        <div class="games-grid" id="listaGier"></div>

        <div id="brakWynikow" class="no-results">
            <p style="margin-bottom:15px;">Nie znaleziono tej gry na liście powyżej.</p>
            <a id="linkSteamSzukaj" href="https://steampowered.com" target="_blank" class="steam-btn">Szukaj bezpośrednio na Steam</a>
        </div>
    </main>

    <script>
        var gry = [
            { id: 3240220, nazwa: "Grand Theft Auto V Enhanced", gatunek: "Akcja / Otwarty świat", cena: "129,00 zł", img: "GTA.jpg" },
            { id: 730, nazwa: "Counter-Strike 2", gatunek: "FPS / Akcja", cena: "Free to Play", img: "CS.jpg" },
            { id: 1091500, nazwa: "Cyberpunk 2077", gatunek: "RPG / Sci-Fi", cena: "199,00 zł", img: "CYBERPUNK.jpg" },
            { id: 292030, nazwa: "Wiedźmin 3: Dziki Gon", gatunek: "RPG / Fantasy", cena: "99,99 zł", img: "wiedzmin.jpg" },
            { id: 1174180, nazwa: "Red Dead Redemption 2", gatunek: "Akcja / Przygoda", cena: "249,90 zł", img: "READ.jpg" },
            { id: 252490, nazwa: "Rust", gatunek: "Survival / Multiplayer", cena: "184,99 zł", img: "RUST.jpg" },
            { id: 105600, nazwa: "Terraria", gatunek: "Sandbox / Przygoda", cena: "45,99 zł", img: "" },
            { id: 1245620, nazwa: "ELDEN RING", gatunek: "RPG / Souls-like", cena: "249,00 zł", img: "" },
            { id: 227300, nazwa: "Euro Truck Simulator 2", gatunek: "Symulator / Jazda", cena: "79,99 zł", img: "" },
            { id: 1086940, nazwa: "Baldur's Gate 3", gatunek: "RPG / Strategia", cena: "249,00 zł", img: "" },
            { id: 1551360, nazwa: "Forza Horizon 5", gatunek: "Wyścigi / Otwarty świat", cena: "249,90 zł", img: "" },
            { id: 1623730, nazwa: "Palworld", gatunek: "Survival / Otwarty świat", cena: "138,99 zł", img: "" }
        ];

        function pokazGry(lista) {
            var kontener = document.getElementById('listaGier');
            kontener.innerHTML = '';
            for (var i = 0; i < lista.length; i++) {
                var g = lista[i];
                var obrazek = g.img ? '<img src="' + g.img + '" alt="' + g.nazwa + '">' : '';
                kontener.innerHTML += 
                    '<div class="game-card">' + obrazek +
                        '<div class="card-body">' +
                            '<div><h4>' + g.nazwa + '</h4><div class="genre-tag">' + g.gatunek + '</div></div>' +
                            '<div>' +
                                '<div class="steam-warning">⚠ Kliknięcie otworzy aplikację Steam. Jeśli jej nie posiadasz, link nie zadziała.</div>' +
                                '<div class="price-action"><span class="price-tag">' + g.cena + '</span><a href="steam://store/' + g.id + '" class="steam-btn">Kup na Steam</a></div>' +
                            '</div>' +
                        '</div>' +
                    '</div>';
            }
        }

        function szukajGry() {
            var tekst = document.getElementById('searchBox').value.toLowerCase().trim();
            var wynik = gry.filter(function(g) {
                return g.nazwa.toLowerCase().indexOf(tekst) > -1 || g.gatunek.toLowerCase().indexOf(tekst) > -1;
            });
            pokazGry(wynik);
            var brak = document.getElementById('brakWynikow');
            if (wynik.length === 0 && tekst.length > 0) {
                brak.style.display = 'block';
                document.getElementById('linkSteamSzukaj').href = 'https://steampowered.com?term=' + encodeURIComponent(tekst);
            } else {
                brak.style.display = 'none';
            }
        }

        function wyczysc() {
            document.getElementById('searchBox').value = '';
            szukajGry();
        }

        pokazGry(gry);
    </script>
</body>
</html>
