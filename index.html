<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEM - GX Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: radial-gradient(circle at top center, #1b1024 0%, #09090d 75%);
            color: #e4e4eb;
            min-height: 100vh;
        }
        header {
            background-color: #0d0d12;
            padding: 15px 4%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #fa1e4e;
            box-shadow: 0 4px 20px rgba(250, 30, 78, 0.25);
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 45px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }
        .logo img {
            height: 45px;
            width: auto;
            display: block;
            filter: drop-shadow(0 0 6px rgba(250, 30, 78, 0.4));
        }
        .logo-text {
            color: #ffffff;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        nav a {
            color: #9e9eb3;
            text-decoration: none;
            margin-right: 22px;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            transition: color 0.2s, text-shadow 0.2s;
        }
        nav a.active, nav a:hover {
            color: #fa1e4e;
            text-shadow: 0 0 10px rgba(250, 30, 78, 0.7);
        }
        main {
            max-width: 980px;
            margin: 35px auto;
            padding: 0 20px;
        }
        .search-bar {
            background-color: #14141d;
            border: 1px solid #2b2b3d;
            border-left: 4px solid #fa1e4e;
            padding: 8px 12px;
            margin-bottom: 35px;
            display: flex;
            justify-content: space-between;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-bar:focus-within {
            border-color: #fa1e4e;
            box-shadow: 0 0 15px rgba(250, 30, 78, 0.3);
        }
        .search-bar input {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            padding: 6px 8px;
            font-size: 14px;
            outline: none;
        }
        .search-bar input::placeholder {
            color: #6c6c85;
        }
        h2 {
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 14px;
            color: #ffffff;
            text-transform: uppercase;
            border-left: 3px solid #fa1e4e;
            padding-left: 10px;
        }
        /* Kontener na oficjalny widżet Steam */
        .steam-widget-container {
            background-color: #12121a;
            border: 1px solid #262636;
            padding: 15px;
            margin-bottom: 45px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .steam-widget-container iframe {
            width: 100%;
            height: 190px;
            border: none;
        }
        /* Siatka własnych kart z przyciskiem Kup na Steam */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .game-card {
            background-color: #12121a;
            border: 1px solid #262636;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .game-card:hover {
            transform: translateY(-4px);
            border-color: #fa1e4e;
            box-shadow: 0 6px 20px rgba(250, 30, 78, 0.35);
        }
        .game-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid #262636;
        }
        .card-body {
            padding: 15px;
        }
        .card-body h4 {
            color: #ffffff;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .card-body p {
            color: #9e9eb3;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 15px;
        }
        a.steam-btn {
            display: block;
            text-align: center;
            background-color: #fa1e4e;
            color: #ffffff;
            text-decoration: none;
            padding: 9px 14px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.8px;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        a.steam-btn:hover {
            background-color: #ff3360;
            box-shadow: 0 0 12px rgba(250, 30, 78, 0.8);
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-left">
            <a href="#" class="logo">
                <img src="STEM.png" onerror="this.onerror=null; this.src='stem.png';" alt="STEM Logo">
                <span class="logo-text">STEM</span>
            </a>
            <nav>
                <a href="#" class="active">SKLEP</a>
                <a href="#">SPOŁECZNOŚĆ</a>
                <a href="#">INFORMACJE</a>
                <a href="#">POMOC</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="search-bar">
            <input type="text" id="searchInput" onkeyup="filterGames()" placeholder="Szukaj w sklepie...">
        </div>

        <h2>Wyróżnione na Steam (Widżet na żywo)</h2>
        <div class="steam-widget-container">
            <!-- TUTAJ WKLEJ KOD IFRAME ZE STEAM (np. <iframe src="https://steampowered.com"></iframe>) -->
        </div>

        <h2>Polecane tytuły</h2>
        <div class="games-grid" id="gamesGrid">
            <!-- TUTAJ WKLEJ KARTY Z PRZYCISKIEM "KUP NA STEAM" -->
        </div>
    </main>

    <script>
        function filterGames() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('game-card');
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title');
                cards[i].style.display = title.includes(input) ? "" : "none";
            }
        }
    </script>
</body>
</html>
