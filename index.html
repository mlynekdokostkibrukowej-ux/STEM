<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEM</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: radial-gradient(circle at top center, #1b1024 0%, #09090d 75%);
            color: #e4e4eb;
            min-height: 100vh;
        }
        header {
            background-color: #0d0d12;
            padding: 15px 4%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #fa1e4e;
            box-shadow: 0 4px 20px rgba(250, 30, 78, 0.25);
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 45px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
        }
        .logo img {
            height: 45px;
            width: auto;
            display: block;
            filter: drop-shadow(0 0 6px rgba(250, 30, 78, 0.4));
        }
        .logo-text {
            color: #ffffff;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        nav a {
            color: #9e9eb3;
            text-decoration: none;
            margin-right: 22px;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            transition: color 0.2s, text-shadow 0.2s;
        }
        nav a.active, nav a:hover {
            color: #fa1e4e;
            text-shadow: 0 0 10px rgba(250, 30, 78, 0.7);
        }
        .cart-badge {
            background-color: transparent;
            border: 1px solid #fa1e4e;
            color: #fa1e4e;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(250, 30, 78, 0.2);
        }
        main {
            max-width: 980px;
            margin: 35px auto;
            padding: 0 20px;
        }
        .search-bar {
            background-color: #14141d;
            border: 1px solid #2b2b3d;
            border-left: 4px solid #fa1e4e;
            padding: 8px 12px;
            margin-bottom: 35px;
            display: flex;
            justify-content: space-between;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-bar:focus-within {
            border-color: #fa1e4e;
            box-shadow: 0 0 15px rgba(250, 30, 78, 0.3);
        }
        .search-bar input {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            padding: 6px 8px;
            font-size: 14px;
            outline: none;
        }
        .search-bar input::placeholder {
            color: #6c6c85;
        }
        h2 {
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 14px;
            color: #ffffff;
            text-transform: uppercase;
            border-left: 3px solid #fa1e4e;
            padding-left: 10px;
        }
        .featured {
            display: flex;
            background-color: #12121a;
            border: 1px solid #262636;
            min-height: 250px;
            margin-bottom: 45px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .game-card {
            background-color: #12121a;
            border: 1px solid #262636;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .game-card:hover {
            transform: translateY(-4px);
            border-color: #fa1e4e;
            box-shadow: 0 6px 20px rgba(250, 30, 78, 0.35);
        }
        .game-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid #262636;
        }
        .card-body {
            padding: 15px;
        }
        .card-body h4 {
            color: #ffffff;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }
        .discount-box {
            display: flex;
            align-items: center;
            background: #09090d;
            border: 1px solid #262636;
        }
        .discount {
            background-color: #fa1e4e;
            color: #ffffff;
            padding: 5px 8px;
            font-weight: bold;
            font-size: 14px;
        }
        .price {
            padding: 5px 10px;
            color: #e4e4eb;
            font-size: 14px;
            font-weight: bold;
        }
        button.buy-btn {
            background-color: #fa1e4e;
            border: none;
            color: #ffffff;
            padding: 7px 14px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        button.buy-btn:hover {
            background-color: #ff3360;
            box-shadow: 0 0 12px rgba(250, 30, 78, 0.8);
        }
        @media (max-width: 768px) {
            .featured { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-left">
            <a href="#" class="logo">
                <img src="STEM.png" onerror="this.onerror=null; this.src='stem.png';" alt="STEM Logo">
                <span class="logo-text">STEM</span>
            </a>
            <nav>
                <a href="#" class="active">SKLEP</a>
                <a href="#">SPOŁECZNOŚĆ</a>
                <a href="#">INFORMACJE</a>
                <a href="#">POMOC</a>
            </nav>
        </div>
        <div class="cart-badge">Koszyk (<span id="cart-count">0</span>)</div>
    </header>

    <main>
        <div class="search-bar">
            <input type="text" id="searchInput" onkeyup="filterGames()" placeholder="Szukaj w sklepie...">
        </div>

        <h2>Wyróżnione i polecane</h2>
        <div class="featured">
            <!-- Miejsce na Twoją wyróżnioną pozycję -->
        </div>

        <h2>Oferty specjalne</h2>
        <div class="games-grid" id="gamesGrid">
            <!-- Miejsce na Twoje karty z grami / produktami -->
        </div>
    </main>

    <script>
        let count = 0;
        function addToCart() {
            count++;
            document.getElementById('cart-count').innerText = count;
        }

        function filterGames() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('game-card');
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getAttribute('data-title');
                cards[i].style.display = title.includes(input) ? "" : "none";
            }
        }
    </script>
</body>
</html>
